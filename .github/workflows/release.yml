name: Build and release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: mytools-master-release
  cancel-in-progress: false

jobs:
  release:
    name: Test and create Velopack release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            .config/dotnet-tools.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: MyTools.Plugins/Examples/package-lock.json

      - name: Build Node plugin examples
        shell: pwsh
        working-directory: .\MyTools.Plugins\Examples
        run: |
          npm ci
          npm run build

          $pluginDirectories = @('hello-search', 'deepseek-chat', 'deepseek-translator')
          foreach ($pluginDirectory in $pluginDirectories) {
              $manifestPath = Join-Path (Join-Path $PWD $pluginDirectory) 'dist\plugin.json'
              if (-not (Test-Path $manifestPath -PathType Leaf)) {
                  throw "Node plugin manifest is missing: $manifestPath"
              }

              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              foreach ($entry in $manifest.entries) {
                  $backendPath = Join-Path (Split-Path $manifestPath) $entry.entry
                  $detailPath = Join-Path (Split-Path $manifestPath) $entry.detail.entry
                  if (-not (Test-Path $backendPath -PathType Leaf)) {
                      throw "Node plugin backend is missing: $backendPath"
                  }
                  if (-not (Test-Path $detailPath -PathType Leaf)) {
                      throw "Node plugin detail page is missing: $detailPath"
                  }
              }

              Write-Host "Verified Node plugin: $($manifest.name)"
          }

      - name: Validate v3 protocol fixtures and migrated manifests
        shell: pwsh
        run: |
          # TS-side drift self-check: the hand-written protocol types must round-trip the canonical
          # fixtures shared with the C# side (MyTools.Protocol.Test/Fixtures/*.json). No build step —
          # the self-check is plain ESM.
          node .\MyTools.Plugins\Examples\sdk-v3\fixtures-selfcheck.mjs
          if ($LASTEXITCODE -ne 0) {
              throw "v3 protocol fixture drift self-check failed"
          }

          # Node SDK v3 unit tests (protocol codec + framing + transport + router), mirroring the C# side.
          # Glob the files: Node 22 on Windows treats `node --test path\to\dir\` as a single CJS
          # module (`Cannot find module ...\test`) instead of expanding the directory.
          node --test "MyTools.Plugins/Examples/sdk-v3/test/**/*.test.mjs"
          if ($LASTEXITCODE -ne 0) {
              throw "v3 Node SDK tests failed"
          }

          # Validate every example plugin.json carries protocolVersion 3.0 and non-empty entries.
          $manifests = Get-ChildItem -Path .\MyTools.Plugins\Examples -Filter 'plugin.json' -Recurse |
              Where-Object { $_.FullName -notmatch '\\dist\\|\\node_modules\\|\\sdk-v3\\|\\common\\' }
          if ($manifests.Count -eq 0) {
              throw "No plugin.json manifests found under Examples."
          }
          foreach ($manifestFile in $manifests) {
              $m = Get-Content $manifestFile.FullName -Raw | ConvertFrom-Json
              if ($m.protocolVersion -ne '3.0') {
                  throw "$($manifestFile.FullName): protocolVersion must be '3.0', got '$($m.protocolVersion)'"
              }
              if (-not $m.entries -or $m.entries.Count -eq 0) {
                  throw "$($manifestFile.FullName): must declare at least one entry"
              }
              $entryIds = @()
              foreach ($entry in $m.entries) {
                  if (-not $entry.id) {
                      throw "$($manifestFile.FullName): entry missing id"
                  }
                  if ($entryIds -contains $entry.id) {
                      throw "$($manifestFile.FullName): duplicate entry id '$($entry.id)'"
                  }
                  $entryIds += $entry.id
                  if (-not $entry.entry) {
                      throw "$($manifestFile.FullName): entry '$($entry.id)' missing entry"
                  }
              }
              Write-Host "Verified plugin manifest: $($manifestFile.FullName)"
          }

      - name: Restore dependencies and tools
        shell: pwsh
        run: |
          dotnet restore .\MyTools.sln
          dotnet tool restore --tool-manifest .\.config\dotnet-tools.json

      - name: Run automated tests
        shell: pwsh
        run: >-
          dotnet test .\MyTools.sln
          --configuration Release
          --no-restore
          --nologo
          --filter "FullyQualifiedName!~OpenAIServiceTest"

      - name: Calculate next release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $pattern = '^(?:v)?(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$'

          function ConvertTo-VersionInfo([string] $value) {
              $match = [regex]::Match($value.Trim(), $pattern)
              if (-not $match.Success) {
                  return $null
              }

              return [pscustomobject]@{
                  Major = [System.Numerics.BigInteger]::Parse($match.Groups['major'].Value)
                  Minor = [System.Numerics.BigInteger]::Parse($match.Groups['minor'].Value)
                  Patch = [System.Numerics.BigInteger]::Parse($match.Groups['patch'].Value)
                  Tag = $value.Trim()
              }
          }

          $baseline = ConvertTo-VersionInfo (Get-Content .\version.txt -Raw)
          if ($null -eq $baseline) {
              throw "version.txt must contain a valid semantic version."
          }

          $releaseCandidates = @()
          $releaseList = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          foreach ($release in $releaseList) {
              $candidate = ConvertTo-VersionInfo $release.tagName
              if ($null -ne $candidate) {
                  $releaseCandidates += $candidate
              }
          }

          $latestRelease = $releaseCandidates |
              Sort-Object -Property `
                  @{ Expression = 'Major'; Descending = $true },
                  @{ Expression = 'Minor'; Descending = $true },
                  @{ Expression = 'Patch'; Descending = $true } |
              Select-Object -First 1

          $current = @($baseline) + @($releaseCandidates) |
              Sort-Object -Property `
                  @{ Expression = 'Major'; Descending = $true },
                  @{ Expression = 'Minor'; Descending = $true },
                  @{ Expression = 'Patch'; Descending = $true } |
              Select-Object -First 1

          $version = '{0}.{1}.{2}' -f $current.Major, $current.Minor, ($current.Patch + 1)
          $previousTag = if ($null -eq $latestRelease) { '' } else { $latestRelease.Tag }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Prepare clean release directory
        shell: pwsh
        run: |
          Remove-Item .\Releases -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path .\Releases | Out-Null

      - name: Download previous full package for delta generation
        if: steps.version.outputs.previous_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          gh release download $env:PREVIOUS_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern 'MyTools-*-full.nupkg' `
            --dir .\Releases

          if ($LASTEXITCODE -ne 0) {
              Write-Host 'No package from the new MyTools release line was found. Starting without a delta base.'
              $global:LASTEXITCODE = 0
          }

      - name: Create Velopack packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet publish .\MyTools.Desktop\MyTools.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --property:CreateVelopackRelease=true
          --property:VelopackChannel=win
          --property:Version=$env:RELEASE_VERSION

      - name: Verify release outputs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installerName = 'MyTools-win-Setup.exe'
          $portableName = 'MyTools-win-Portable.zip'
          $installerAssetName = "MyTools-$env:RELEASE_VERSION-windows-x64-setup.exe"
          $portableAssetName = "MyTools-$env:RELEASE_VERSION-windows-x64-portable.zip"
          $requiredPatterns = @(
              "MyTools-$env:RELEASE_VERSION-full.nupkg",
              $installerName,
              $portableName,
              'RELEASES',
              'assets.win.json',
              'releases.win.json'
          )

          foreach ($pattern in $requiredPatterns) {
              if (-not (Test-Path (Join-Path .\Releases $pattern) -PathType Leaf)) {
                  throw "Required Velopack output is missing: $pattern"
              }
          }

          Copy-Item (Join-Path .\Releases $installerName) (Join-Path .\Releases $installerAssetName)
          Copy-Item (Join-Path .\Releases $portableName) (Join-Path .\Releases $portableAssetName)

          $assetsManifestPath = Join-Path .\Releases 'assets.win.json'
          $assetsManifest = Get-Content $assetsManifestPath -Raw | ConvertFrom-Json
          foreach ($asset in $assetsManifest) {
              switch ($asset.Type) {
                  'Installer' { $asset.RelativeFileName = $installerAssetName }
                  'Portable' { $asset.RelativeFileName = $portableAssetName }
              }
          }
          $assetsManifest | ConvertTo-Json -Compress | Set-Content $assetsManifestPath -Encoding utf8

          Get-ChildItem .\Releases -File | Sort-Object Name | Format-Table Name, Length

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installerName = "MyTools-$env:RELEASE_VERSION-windows-x64-setup.exe"
          $portableName = "MyTools-$env:RELEASE_VERSION-windows-x64-portable.zip"
          $fullPackageName = "MyTools-$env:RELEASE_VERSION-full.nupkg"
          $deltaPackageName = "MyTools-$env:RELEASE_VERSION-delta.nupkg"

          $assets = @(
              "$(Resolve-Path (Join-Path .\Releases $installerName))#Windows x64 Installer (Recommended)"
              "$(Resolve-Path (Join-Path .\Releases $portableName))#Windows x64 Portable"
              "$(Resolve-Path (Join-Path .\Releases $fullPackageName))#Automatic updater package"
              "$(Resolve-Path .\Releases\RELEASES)#Automatic updater metadata"
              "$(Resolve-Path .\Releases\assets.win.json)#Automatic updater asset metadata"
              "$(Resolve-Path .\Releases\releases.win.json)#Automatic updater release metadata"
          )

          $deltaPackagePath = Join-Path .\Releases $deltaPackageName
          if (Test-Path $deltaPackagePath -PathType Leaf) {
              $assets += "$(Resolve-Path $deltaPackagePath)#Automatic updater delta package"
          }

          $repositoryUrl = "https://github.com/$env:GITHUB_REPOSITORY"
          $downloadBaseUrl = "$repositoryUrl/releases/download/$env:RELEASE_TAG"
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          ## Download

          **[Download Windows x64 Installer (Recommended)]($downloadBaseUrl/$installerName)**

          [Download Windows x64 Portable]($downloadBaseUrl/$portableName)

          > The `.nupkg`, `.json`, and `RELEASES` assets are used by the automatic updater. Most users do not need to download them.

          ## What's Changed
          "@ | Set-Content -Path $releaseNotesPath -Encoding utf8

          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "MyTools v$env:RELEASE_VERSION" `
            --notes-file $releaseNotesPath `
            --generate-notes `
            @assets


