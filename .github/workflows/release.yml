name: Build and release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'release-*'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mytools-release
  cancel-in-progress: false

jobs:
  release:
    name: Test and create Velopack release
    if: >
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/tags/release-') ||
        (
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          github.actor != 'github-actions[bot]' &&
          !contains(github.event.head_commit.message, '[skip release]')
        )
      )
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release channel
        id: channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF -like 'refs/tags/release-*') {
              $tag = $env:GITHUB_REF_NAME
              if ($tag -notmatch '^release-(?:\d{4}-\d{2}-\d{2}|\d{8})(?:-\d+)?$') {
                  throw "Stable tags must look like release-2026-08-21 or release-20260821. Got: $tag"
              }

              "name=stable" >> $env:GITHUB_OUTPUT
              "velopack=stable" >> $env:GITHUB_OUTPUT
              "prerelease=false" >> $env:GITHUB_OUTPUT
              "label=Stable" >> $env:GITHUB_OUTPUT
              Write-Host "Channel: stable (tag $tag)"
          } else {
              "name=beta" >> $env:GITHUB_OUTPUT
              "velopack=beta" >> $env:GITHUB_OUTPUT
              "prerelease=true" >> $env:GITHUB_OUTPUT
              "label=Beta" >> $env:GITHUB_OUTPUT
              Write-Host "Channel: beta"
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            .config/dotnet-tools.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Keep in sync with MyTools.Desktop NodeRuntimeVersion so bundling can reuse this node.exe.
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: MyTools.Plugins/Examples/package-lock.json

      - name: Record runner Node for bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=== Requested bundled Node ==="
          Write-Host "MyTools.Desktop NodeRuntimeVersion is pinned in csproj (currently 24.19.0)"
          Write-Host "setup-node requested: 24.19.0"

          $nodeCmd = Get-Command node -ErrorAction SilentlyContinue
          if ($null -eq $nodeCmd) {
              throw "node was not found on PATH after setup-node."
          }

          $node = $nodeCmd.Source
          $version = (& $node -v).Trim()
          $npmCmd = Get-Command npm -ErrorAction SilentlyContinue
          $npmVersion = if ($null -eq $npmCmd) { '(npm not on PATH)' } else { (& npm -v).Trim() }

          Write-Host "=== Active Node on PATH ==="
          Write-Host "node.exe: $node"
          Write-Host "node -v:  $version"
          Write-Host "npm -v:   $npmVersion"

          Write-Host "=== node.exe on PATH ==="
          $pathNodes = Get-Command node -All -ErrorAction SilentlyContinue
          if ($null -eq $pathNodes) {
              Write-Host "(none)"
          } else {
              foreach ($entry in @($pathNodes)) {
                  $entryVersion = $null
                  try { $entryVersion = (& $entry.Source -v 2>$null).Trim() } catch { }
                  Write-Host ("{0,-10} {1,-12} {2}" -f $entry.CommandType, $(if ($entryVersion) { $entryVersion } else { '?' }), $entry.Source)
              }
          }

          $toolCache = $env:RUNNER_TOOL_CACHE
          Write-Host "=== Hosted tool cache (RUNNER_TOOL_CACHE=$toolCache) ==="
          $nodeToolRoot = Join-Path $toolCache 'node'
          if ([string]::IsNullOrWhiteSpace($toolCache) -or -not (Test-Path -LiteralPath $nodeToolRoot)) {
              Write-Host "No Node installs under the Actions tool cache."
          } else {
              Get-ChildItem -LiteralPath $nodeToolRoot -Recurse -Filter 'node.exe' |
                  ForEach-Object {
                      $toolVersion = $null
                      try { $toolVersion = (& $_.FullName -v 2>$null).Trim() } catch { }
                      Write-Host ("{0}  {1}" -f $(if ($toolVersion) { $toolVersion } else { '?' }), $_.FullName)
                  }
          }

          "MYTOOLS_PREFERRED_NODE_EXE=$node" >> $env:GITHUB_ENV
          Write-Host "Recorded MYTOOLS_PREFERRED_NODE_EXE=$node"

      - name: Build Node plugin examples
        shell: pwsh
        working-directory: .\MyTools.Plugins\Examples
        run: |
          npm ci
          npm run build

          $pluginDirectories = Get-ChildItem -Path $PWD -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'plugin.json') } |
              Select-Object -ExpandProperty Name
          if ($pluginDirectories.Count -eq 0) {
              throw "No Node plugin examples found."
          }

          foreach ($pluginDirectory in $pluginDirectories) {
              $manifestPath = Join-Path (Join-Path $PWD $pluginDirectory) 'dist\plugin.json'
              if (-not (Test-Path $manifestPath -PathType Leaf)) {
                  throw "Node plugin manifest is missing: $manifestPath"
              }

              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              if (-not $manifest.entry) {
                  throw "Node plugin $($pluginDirectory) is missing entry"
              }

              $backendPath = Join-Path (Split-Path $manifestPath) $manifest.entry
              if (-not (Test-Path $backendPath -PathType Leaf)) {
                  throw "Node plugin backend is missing: $backendPath"
              }

              if ($manifest.detail -and $manifest.detail.entry) {
                  $detailPath = Join-Path (Split-Path $manifestPath) $manifest.detail.entry
                  if (-not (Test-Path $detailPath -PathType Leaf)) {
                      throw "Node plugin detail page is missing: $detailPath"
                  }
              }

              Write-Host "Verified Node plugin: $($pluginDirectory)"
          }
          
      - name: Restore dependencies and tools
        shell: pwsh
        run: |
          dotnet restore .\MyTools.sln
          dotnet tool restore --tool-manifest .\.config\dotnet-tools.json

      - name: Run automated tests
        shell: pwsh
        run: >-
          dotnet test .\MyTools.sln
          --configuration Release
          --no-restore
          --nologo
          --filter "FullyQualifiedName!~OpenAIServiceTest"

      - name: Calculate next release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.name }}
          RELEASE_LABEL: ${{ steps.channel.outputs.label }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagPattern = '^(?:v)?(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$'
          $titlePattern = 'MyTools v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)'

          function ConvertTo-VersionInfo([string] $value) {
              if ([string]::IsNullOrWhiteSpace($value)) {
                  return $null
              }

              $trimmed = $value.Trim()
              $match = [regex]::Match($trimmed, $tagPattern)
              if (-not $match.Success) {
                  $match = [regex]::Match($trimmed, $titlePattern)
              }
              if (-not $match.Success) {
                  return $null
              }

              return [pscustomobject]@{
                  Major = [System.Numerics.BigInteger]::Parse($match.Groups['major'].Value)
                  Minor = [System.Numerics.BigInteger]::Parse($match.Groups['minor'].Value)
                  Patch = [System.Numerics.BigInteger]::Parse($match.Groups['patch'].Value)
              }
          }

          $baseline = ConvertTo-VersionInfo (Get-Content .\version.txt -Raw)
          if ($null -eq $baseline) {
              throw "version.txt must contain a valid semantic version."
          }

          $releaseCandidates = @()
          $sameChannelCandidates = @()

          git fetch origin --tags --force
          foreach ($existingTag in @(git tag -l 'v*')) {
              $candidate = ConvertTo-VersionInfo $existingTag
              if ($null -eq $candidate) {
                  continue
              }

              $candidate | Add-Member -NotePropertyName Tag -NotePropertyValue $existingTag
              $releaseCandidates += $candidate
          }

          $releaseList = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,name,isPrerelease,isDraft | ConvertFrom-Json
          foreach ($release in $releaseList) {
              if ($release.isDraft) {
                  continue
              }

              $candidate = ConvertTo-VersionInfo $release.tagName
              if ($null -eq $candidate) {
                  $candidate = ConvertTo-VersionInfo $release.name
              }
              if ($null -eq $candidate) {
                  continue
              }

              $candidate | Add-Member -NotePropertyName Tag -NotePropertyValue $release.tagName
              $releaseCandidates += $candidate

              $isBetaRelease = [bool]$release.isPrerelease
              $isCurrentBeta = $env:RELEASE_CHANNEL -eq 'beta'
              if ($isBetaRelease -eq $isCurrentBeta) {
                  $sameChannelCandidates += $candidate
              }
          }

          $current = @($baseline) + @($releaseCandidates) |
              Sort-Object -Property `
                  @{ Expression = 'Major'; Descending = $true },
                  @{ Expression = 'Minor'; Descending = $true },
                  @{ Expression = 'Patch'; Descending = $true } |
              Select-Object -First 1

          $version = '{0}.{1}.{2}' -f $current.Major, $current.Minor, ($current.Patch + 1)
          $previous = $sameChannelCandidates |
              Sort-Object -Property `
                  @{ Expression = 'Major'; Descending = $true },
                  @{ Expression = 'Minor'; Descending = $true },
                  @{ Expression = 'Patch'; Descending = $true } |
              Select-Object -First 1
          $previousTag = if ($null -eq $previous) { '' } else { $previous.Tag }
          $tag = if ($env:RELEASE_CHANNEL -eq 'stable') { $env:GITHUB_REF_NAME } else { "v$version" }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT
          Write-Host "$env:RELEASE_LABEL version: $version (tag $tag)"

      - name: Prepare clean release directory
        shell: pwsh
        run: |
          Remove-Item .\Releases -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path .\Releases | Out-Null

      - name: Download previous full package for delta generation
        if: steps.version.outputs.previous_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          gh release download $env:PREVIOUS_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern 'MyTools-*-full.nupkg' `
            --dir .\Releases

          if ($LASTEXITCODE -ne 0) {
              Write-Host 'No package from the previous MyTools release on this channel was found. Starting without a delta base.'
              $global:LASTEXITCODE = 0
          }

      - name: Cache bundled Node runtime zip
        id: node-runtime-cache
        uses: actions/cache@v5
        with:
          path: artifacts/node-runtime
          key: node-runtime-win-x64-v24.19.0-zip

      - name: Inspect Node zip cache
        shell: pwsh
        env:
          NODE_RUNTIME_CACHE_HIT: ${{ steps.node-runtime-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = "Stop"
          $cacheDir = Join-Path $PWD 'artifacts\node-runtime'
          $hit = $env:NODE_RUNTIME_CACHE_HIT
          if ([string]::IsNullOrWhiteSpace($hit)) { $hit = 'false' }

          Write-Host "=== actions/cache for artifacts/node-runtime ==="
          Write-Host "key: node-runtime-win-x64-v24.19.0-zip"
          Write-Host "cache-hit: $hit"
          Write-Host "This cache only stores the official nodejs.org zip used when runner Node is not v24.19.0."

          $files = @()
          if (Test-Path -LiteralPath $cacheDir) {
              $files = @(Get-ChildItem -LiteralPath $cacheDir -Force -File -Recurse)
          }

          if ($hit -eq 'true' -and $files.Count -eq 0) {
              Write-Host "Cache hit restored an empty directory. Treating it as a miss and deleting $cacheDir so the job will not re-save a blank cache."
              Remove-Item -LiteralPath $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
              return
          }

          if ($files.Count -eq 0) {
              Write-Host "No zip on disk yet. If bundling copies setup-node's node.exe, this directory stays empty and actions/cache will skip saving."
              return
          }

          foreach ($file in $files) {
              Write-Host ("{0,12} bytes  {1}" -f $file.Length, $file.FullName)
          }

      - name: Create Velopack packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          VELOPACK_CHANNEL: ${{ steps.channel.outputs.velopack }}
        run: >-
          dotnet publish .\MyTools.Desktop\MyTools.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --property:CreateVelopackRelease=true
          --property:VelopackChannel=$env:VELOPACK_CHANNEL
          --property:Version=$env:RELEASE_VERSION

      - name: Verify release outputs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          VELOPACK_CHANNEL: ${{ steps.channel.outputs.velopack }}
        run: |
          $channel = $env:VELOPACK_CHANNEL
          $installerName = "MyTools-$channel-Setup.exe"
          $portableName = "MyTools-$channel-Portable.zip"
          $installerAssetName = "MyTools-$env:RELEASE_VERSION-windows-x64-setup.exe"
          $portableAssetName = "MyTools-$env:RELEASE_VERSION-windows-x64-portable.zip"
          $assetsManifestName = "assets.$channel.json"
          $releasesManifestName = "releases.$channel.json"
          $fullPackage = Get-ChildItem .\Releases -File |
              Where-Object { $_.Name -like "MyTools-$env:RELEASE_VERSION-*-full.nupkg" -or $_.Name -eq "MyTools-$env:RELEASE_VERSION-full.nupkg" } |
              Select-Object -First 1
          $bundledNode = Join-Path $PWD 'MyTools.Desktop\bin\Release\net8.0-windows\win-x64\publish-velopack\runtime\node\node.exe'
          if (-not (Test-Path $bundledNode -PathType Leaf)) {
              throw "Bundled Node runtime is missing: $bundledNode"
          }
          $bundledNpm = Join-Path (Split-Path -Parent $bundledNode) 'npm.cmd'
          $bundledNpmCli = Join-Path (Split-Path -Parent $bundledNode) 'node_modules\npm\bin\npm-cli.js'
          if (-not (Test-Path $bundledNpm -PathType Leaf) -or -not (Test-Path $bundledNpmCli -PathType Leaf)) {
              throw "Bundled npm runtime is missing beside: $bundledNode"
          }

          $publishRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $bundledNode))
          $skillRoot = Join-Path $publishRoot 'skills\create-plugin'
          $requiredSkillFiles = @(
              (Join-Path $skillRoot 'SKILL.md'),
              (Join-Path $skillRoot 'references\Examples\plugin-search\plugin.json'),
              (Join-Path $skillRoot 'references\Examples\plugin-search\src\backend\index.mts'),
              (Join-Path $skillRoot 'references\Examples\create-plugin\src\templates\common\package.json.mustache'),
              (Join-Path $skillRoot 'references\Examples\create-plugin\src\templates\common\build-plugin.mjs.mustache')
          )
          foreach ($skillFile in $requiredSkillFiles) {
              if (-not (Test-Path $skillFile -PathType Leaf)) {
                  throw "Bundled create-plugin skill reference is missing: $skillFile"
              }
          }

          $requiredFiles = @(
              $installerName,
              $portableName,
              $assetsManifestName,
              $releasesManifestName
          )

          foreach ($fileName in $requiredFiles) {
              if (-not (Test-Path (Join-Path .\Releases $fileName) -PathType Leaf)) {
                  Get-ChildItem .\Releases -File | Sort-Object Name | Format-Table Name, Length
                  throw "Required Velopack output is missing: $fileName"
              }
          }

          if ($null -eq $fullPackage) {
              Get-ChildItem .\Releases -File | Sort-Object Name | Format-Table Name, Length
              throw "Required Velopack full package is missing for version $env:RELEASE_VERSION"
          }

          Copy-Item (Join-Path .\Releases $installerName) (Join-Path .\Releases $installerAssetName)
          Copy-Item (Join-Path .\Releases $portableName) (Join-Path .\Releases $portableAssetName)

          $assetsManifestPath = Join-Path .\Releases $assetsManifestName
          $assetsManifest = Get-Content $assetsManifestPath -Raw | ConvertFrom-Json
          foreach ($asset in $assetsManifest) {
              switch ($asset.Type) {
                  'Installer' { $asset.RelativeFileName = $installerAssetName }
                  'Portable' { $asset.RelativeFileName = $portableAssetName }
              }
          }
          $assetsManifest | ConvertTo-Json -Compress | Set-Content $assetsManifestPath -Encoding utf8

          Get-ChildItem .\Releases -File | Sort-Object Name | Format-Table Name, Length

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.name }}
          RELEASE_LABEL: ${{ steps.channel.outputs.label }}
          VELOPACK_CHANNEL: ${{ steps.channel.outputs.velopack }}
          IS_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          $channel = $env:VELOPACK_CHANNEL
          $installerName = "MyTools-$env:RELEASE_VERSION-windows-x64-setup.exe"
          $portableName = "MyTools-$env:RELEASE_VERSION-windows-x64-portable.zip"
          $fullPackage = Get-ChildItem .\Releases -File |
              Where-Object { $_.Name -like "MyTools-$env:RELEASE_VERSION-*-full.nupkg" -or $_.Name -eq "MyTools-$env:RELEASE_VERSION-full.nupkg" } |
              Select-Object -First 1
          $deltaPackage = Get-ChildItem .\Releases -File |
              Where-Object { $_.Name -like "MyTools-$env:RELEASE_VERSION-*-delta.nupkg" -or $_.Name -eq "MyTools-$env:RELEASE_VERSION-delta.nupkg" } |
              Select-Object -First 1

          $assets = @(
              "$(Resolve-Path (Join-Path .\Releases $installerName))#Windows x64 Installer (Recommended)"
              "$(Resolve-Path (Join-Path .\Releases $portableName))#Windows x64 Portable"
              "$(Resolve-Path $fullPackage.FullName)#Automatic updater package"
              "$(Resolve-Path (Join-Path .\Releases "assets.$channel.json"))#Automatic updater asset metadata"
              "$(Resolve-Path (Join-Path .\Releases "releases.$channel.json"))#Automatic updater release metadata"
          )

          if ($null -ne $deltaPackage) {
              $assets += "$(Resolve-Path $deltaPackage.FullName)#Automatic updater delta package"
          }

          $legacyReleasesPath = Join-Path .\Releases 'RELEASES'
          if (Test-Path $legacyReleasesPath -PathType Leaf) {
              $assets += "$(Resolve-Path $legacyReleasesPath)#Automatic updater metadata"
          }

          $legacyChannelReleasesPath = Join-Path .\Releases "RELEASES-$channel"
          if (Test-Path $legacyChannelReleasesPath -PathType Leaf) {
              $assets += "$(Resolve-Path $legacyChannelReleasesPath)#Automatic updater metadata"
          }

          $repositoryUrl = "https://github.com/$env:GITHUB_REPOSITORY"
          $downloadBaseUrl = "$repositoryUrl/releases/download/$env:RELEASE_TAG"
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          ## Download

          **[Download Windows x64 Installer (Recommended)]($downloadBaseUrl/$installerName)**

          [Download Windows x64 Portable]($downloadBaseUrl/$portableName)

          Channel: **$env:RELEASE_LABEL** ($channel)

          > The `.nupkg`, `.json`, and `RELEASES` assets are used by the automatic updater. Most users do not need to download them.

          ## What's Changed
          "@ | Set-Content -Path $releaseNotesPath -Encoding utf8

          $tag = $env:RELEASE_TAG
          $sha = $env:GITHUB_SHA
          $tagCommit = git rev-list -n 1 $tag 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
              git tag $tag $sha
              git push origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to push tag $tag"
              }
          } else {
              $tagCommit = $tagCommit.Trim()
              if ($tagCommit -ne $sha) {
                  throw "Tag $tag already points to $tagCommit, expected $sha."
              }
              Write-Host "Tag $tag already points at $sha"
          }

          # Create the release against the existing git tag. Do not pass --target:
          # the Releases API will try to create/move the tag, and GITHUB_TOKEN
          # gets HTTP 403 when that commit changed workflow files.
          $createArgs = @(
              'release', 'create', $tag,
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "MyTools v$env:RELEASE_VERSION ($env:RELEASE_LABEL)",
              '--notes-file', $releaseNotesPath,
              '--generate-notes'
          )

          if ($env:IS_PRERELEASE -eq 'true') {
              $createArgs += '--prerelease'
          } else {
              $createArgs += '--latest'
          }

          $createArgs += $assets
          gh @createArgs

      - name: Update README download matrix
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-ChannelLinks([bool] $Prerelease) {
              $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,name,isPrerelease,isDraft | ConvertFrom-Json
              $match = $releases |
                  Where-Object { -not $_.isDraft -and ([bool]$_.isPrerelease) -eq $Prerelease } |
                  Select-Object -First 1

              if ($null -eq $match) {
                  return [pscustomobject]@{
                      Version = '—'
                      InstallerUrl = ''
                      PortableUrl = ''
                  }
              }

              $details = gh release view $match.tagName --repo $env:GITHUB_REPOSITORY --json assets,tagName,name | ConvertFrom-Json
              $installer = $details.assets | Where-Object { $_.name -like '*-windows-x64-setup.exe' } | Select-Object -First 1
              $portable = $details.assets | Where-Object { $_.name -like '*-windows-x64-portable.zip' } | Select-Object -First 1
              $versionMatch = [regex]::Match("$($details.name) $($installer?.name)", '(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))')
              $version = if ($versionMatch.Success) { $versionMatch.Groups['version'].Value } else { $details.tagName }
              $downloadBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$($details.tagName)"

              return [pscustomobject]@{
                  Version = $version
                  InstallerUrl = if ($null -eq $installer) { '' } else { "$downloadBase/$($installer.name)" }
                  PortableUrl = if ($null -eq $portable) { '' } else { "$downloadBase/$($portable.name)" }
              }
          }

          function Format-Link([string] $Url, [string] $PublishedText, [string] $MissingText) {
              if ([string]::IsNullOrWhiteSpace($Url)) {
                  return $MissingText
              }

              return "[$PublishedText]($Url)"
          }

          function Update-DownloadMatrix {
              param(
                  [string] $Path,
                  [string] $ChannelHeader,
                  [string] $VersionHeader,
                  [string] $InstallerHeader,
                  [string] $PortableHeader,
                  [string] $DownloadText,
                  [string] $MissingText,
                  $Stable,
                  $Beta
              )

              $content = Get-Content -LiteralPath $Path -Raw
              $start = '<!-- mytools-downloads:start -->'
              $end = '<!-- mytools-downloads:end -->'
              $startIndex = $content.IndexOf($start)
              $endIndex = $content.IndexOf($end)
              if ($startIndex -lt 0 -or $endIndex -lt 0 -or $endIndex -le $startIndex) {
                  throw "Download matrix markers are missing in $Path"
              }

              $newline = if ($content.Contains("`r`n")) { "`r`n" } else { "`n" }
              $table = @"
          $start
          | $ChannelHeader | $VersionHeader | $InstallerHeader | $PortableHeader |
          | --- | --- | --- | --- |
          | **Stable** | $($Stable.Version) | $(Format-Link $Stable.InstallerUrl $DownloadText $MissingText) | $(Format-Link $Stable.PortableUrl $DownloadText $MissingText) |
          | **Beta** | $($Beta.Version) | $(Format-Link $Beta.InstallerUrl $DownloadText $MissingText) | $(Format-Link $Beta.PortableUrl $DownloadText $MissingText) |
          $end
          "@
              $table = ($table -replace "`r`n", "`n" -replace "`n", $newline).TrimEnd()
              $updated = $content.Substring(0, $startIndex) + $table + $newline + $content.Substring($endIndex + $end.Length)
              [System.IO.File]::WriteAllText((Resolve-Path $Path), $updated.TrimEnd() + $newline)
          }

          $stable = Get-ChannelLinks -Prerelease $false
          $beta = Get-ChannelLinks -Prerelease $true
          $branch = if ([string]::IsNullOrWhiteSpace($env:DEFAULT_BRANCH)) { 'main' } else { $env:DEFAULT_BRANCH }

          git fetch origin $branch
          git checkout --force -B $branch "origin/$branch"

          Update-DownloadMatrix `
              -Path .\README.md `
              -ChannelHeader 'Channel' `
              -VersionHeader 'Version' `
              -InstallerHeader 'Installer (full setup)' `
              -PortableHeader 'Portable' `
              -DownloadText 'Download' `
              -MissingText 'Not published yet' `
              -Stable $stable `
              -Beta $beta

          Update-DownloadMatrix `
              -Path .\README.zh-CN.md `
              -ChannelHeader '通道' `
              -VersionHeader '版本' `
              -InstallerHeader '完整安装包' `
              -PortableHeader '便携版' `
              -DownloadText '下载' `
              -MissingText '尚未发布' `
              -Stable $stable `
              -Beta $beta

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md
          $changedFiles = @(git diff --cached --name-only -- README.md README.zh-CN.md)
          if ($changedFiles.Count -eq 0) {
              Write-Host 'README download matrix is already up to date.'
              exit 0
          }

          git commit -m "docs: update download links [skip release]"
          git push origin $branch
