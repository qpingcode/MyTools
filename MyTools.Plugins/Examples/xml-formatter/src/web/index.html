<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="[text]Plugin.XmlFormatter.Name" data-i18n-default-value="XML Formatter"></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="toolbar">
            <select id="indent" class="toolbar-select" title="Indent">
                <option value="2" data-i18n="[text]Plugin.XmlFormatter.Detail.Indent2" data-i18n-default-value="2 spaces">2 spaces</option>
                <option value="4" data-i18n="[text]Plugin.XmlFormatter.Detail.Indent4" data-i18n-default-value="4 spaces">4 spaces</option>
                <option value="tab" data-i18n="[text]Plugin.XmlFormatter.Detail.IndentTab" data-i18n-default-value="Tab">Tab</option>
            </select>
            <button id="formatButton" class="toolbar-button primary" type="button"
                    data-i18n="[text]Plugin.XmlFormatter.Detail.Format"
                    data-i18n-default-value="Format"></button>
            <button id="copyButton" class="toolbar-button" type="button"
                    data-i18n="[text]Plugin.XmlFormatter.Detail.Copy"
                    data-i18n-default-value="Copy"></button>
            <button id="clearButton" class="toolbar-button" type="button"
                    data-i18n="[text]Plugin.XmlFormatter.Detail.Clear"
                    data-i18n-default-value="Clear"></button>
            <button id="collapseAllButton" class="toolbar-button" type="button"
                    data-i18n="[text]Plugin.XmlFormatter.Detail.CollapseAll"
                    data-i18n-default-value="Collapse All"></button>
            <button id="expandAllButton" class="toolbar-button" type="button"
                    data-i18n="[text]Plugin.XmlFormatter.Detail.ExpandAll"
                    data-i18n-default-value="Expand All"></button>
        </div>

        <div class="panes">
            <div class="pane">
                <div class="pane-label" data-i18n="[text]Plugin.XmlFormatter.Detail.Input"
                     data-i18n-default-value="Input"></div>
                <textarea id="input" class="code-area" spellcheck="false"
                          data-i18n="[placeholder]Plugin.XmlFormatter.Detail.InputPlaceholder"
                          data-i18n-default-value="Paste XML here"></textarea>
            </div>
            <div class="pane">
                <div class="pane-label" data-i18n="[text]Plugin.XmlFormatter.Detail.Output"
                     data-i18n-default-value="Output"></div>
                <div id="output" class="code-area output tree-output">
                    <span class="placeholder" data-i18n="[text]Plugin.XmlFormatter.Detail.EmptyOutput" data-i18n-default-value="(no output)"></span>
                </div>
            </div>
        </div>

        <div id="message" class="message hidden"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
