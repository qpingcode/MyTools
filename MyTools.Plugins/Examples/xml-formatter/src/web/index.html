<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="[text]Plugin.XmlFormatter.Name" data-i18n-default-value="XML Formatter"></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="toolbar">
            <label class="toolbar-field">
                <span data-i18n="[text]Plugin.XmlFormatter.Detail.Indent" data-i18n-default-value="Indent"></span>
                <select id="indent">
                    <option value="2" data-i18n="[text]Plugin.XmlFormatter.Detail.Indent2" data-i18n-default-value="2 spaces">2 spaces</option>
                    <option value="4" data-i18n="[text]Plugin.XmlFormatter.Detail.Indent4" data-i18n-default-value="4 spaces">4 spaces</option>
                    <option value="tab" data-i18n="[text]Plugin.XmlFormatter.Detail.IndentTab" data-i18n-default-value="Tab">Tab</option>
                </select>
            </label>
            <button id="formatButton" class="toolbar-button" type="button"><span data-action-name="format"></span><kbd data-action-hotkey="format"></kbd></button>
            <button id="clearButton" class="toolbar-button" type="button"><span data-action-name="clear"></span><kbd data-action-hotkey="clear"></kbd></button>
            <span class="toolbar-spacer"></span>
            <button id="collapseAllButton" class="toolbar-button" type="button"><span data-action-name="collapse-all"></span><kbd data-action-hotkey="collapse-all"></kbd></button>
            <button id="expandAllButton" class="toolbar-button" type="button"><span data-action-name="expand-all"></span><kbd data-action-hotkey="expand-all"></kbd></button>
        </div>

        <div class="panes">
            <div class="pane">
                <div class="pane-label" data-i18n="[text]Plugin.XmlFormatter.Detail.Input"
                     data-i18n-default-value="Input"></div>
                <textarea id="input" class="code-area" spellcheck="false"
                          data-i18n="[placeholder]Plugin.XmlFormatter.Detail.InputPlaceholder"
                          data-i18n-default-value="Paste XML here"></textarea>
            </div>
            <div class="pane">
                <div class="pane-label" data-i18n="[text]Plugin.XmlFormatter.Detail.Output"
                     data-i18n-default-value="Output"></div>
                <div id="output" class="code-area output tree-output">
                    <span class="placeholder" data-i18n="[text]Plugin.XmlFormatter.Detail.EmptyOutput" data-i18n-default-value="(no output)"></span>
                </div>
            </div>
        </div>

        <div id="message" class="message hidden"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
