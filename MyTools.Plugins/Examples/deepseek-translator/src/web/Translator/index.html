<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="[text]Plugin.DeepSeekTranslator.Name" data-i18n-default-value="DeepSeek Translator"></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="translator">
            <div class="panel input-panel">
                <div class="label-row">
                    <label class="label" for="sourceText" data-i18n="[text]Plugin.DeepSeekTranslator.Detail.Input" data-i18n-default-value="Input"></label>
                    <button id="sendMode" class="send-mode" type="button"
                            data-i18n="[text]Plugin.DeepSeekTranslator.Detail.Mode.Enter"
                            data-i18n-default-value="Enter Mode"></button>
                    <button id="historyButton" class="history-button" type="button"
                            data-i18n="[title][aria-label]Plugin.DeepSeekTranslator.Detail.History"
                            data-i18n-default-value="Translation history"><span class="history-clock" aria-hidden="true"></span></button>
                    <button id="favoriteListButton" class="history-button favorite-list-button" type="button"
                            data-i18n="[title][aria-label]Plugin.DeepSeekTranslator.Detail.FavoriteList"
                            data-i18n-default-value="Favorite list">★</button>
                </div>
                <textarea id="sourceText" spellcheck="false"
                          data-i18n="[placeholder]Plugin.DeepSeekTranslator.Detail.InputPlaceholder"
                          data-i18n-default-value="Enter text to translate"></textarea>
            </div>

            <div class="panel result-panel">
                <div class="label-row">
                    <button id="historyBackButton" class="result-back-button" type="button"
                            data-i18n="[title][aria-label]Plugin.DeepSeekTranslator.Detail.Back"
                            data-i18n-default-value="Back to translation" hidden></button>
                    <div id="resultTitle" class="label" data-i18n="[text]Plugin.DeepSeekTranslator.Detail.Translation" data-i18n-default-value="Translation"></div>
                    <div id="sourceStatus" class="source-status" hidden></div>
                    <button id="favoriteButton" class="star-button" type="button" hidden>☆</button>
                </div>
                <div id="translation" class="translation empty"
                     data-i18n="[text]Plugin.DeepSeekTranslator.Detail.Empty"
                     data-i18n-default-value="Translation appears here"></div>
            </div>
        </section>
    </main>

    <script src="../common/speech.js"></script>
    <script src="main.js"></script>
</body>
</html>
