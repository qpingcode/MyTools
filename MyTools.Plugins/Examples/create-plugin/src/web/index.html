<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="./style.css">
  <title data-i18n="[text]Plugin.CreatePlugin.Name" data-i18n-default-value="Create Plugin"></title>
</head>
<body>
<main class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon">M</span><div><strong data-i18n="[text]Plugin.CreatePlugin.Detail.Title" data-i18n-default-value="Plugin Studio"></strong><small data-i18n="[text]Plugin.CreatePlugin.Detail.Subtitle" data-i18n-default-value="Build MyTools plugins with AI"></small></div></div>
    <button id="newPlugin" class="new-plugin"><span>＋</span><span data-i18n="[text]Plugin.CreatePlugin.Action.New" data-i18n-default-value="New plugin"></span></button>
    <div class="sidebar-heading"><span data-i18n="[text]Plugin.CreatePlugin.List.Title" data-i18n-default-value="In development"></span><span id="pluginCount"></span></div>
    <div id="pluginList" class="plugin-list"></div>
    <p id="pluginListEmpty" class="empty-state" data-i18n="[text]Plugin.CreatePlugin.List.Empty" data-i18n-default-value="No plugins yet. Create your first plugin."></p>
    <button id="refreshAll" class="sidebar-action" data-i18n="[title]Plugin.CreatePlugin.Action.RefreshAll.Description" data-i18n-default-value="Reload all development plugins in MyTools"><span>↻</span><span data-i18n="[text]Plugin.CreatePlugin.Action.RefreshAll" data-i18n-default-value="Reload plugins"></span></button>
  </aside>

  <section class="conversation">
    <header class="toolbar">
      <nav id="pluginTools" class="menu-bar" hidden>
        <div class="menu-root">
          <button id="developMenuButton" class="menu-trigger" aria-haspopup="true" aria-expanded="false" data-i18n="[text]Plugin.CreatePlugin.Toolbar.Develop" data-i18n-default-value="Develop"></button>
          <div id="developMenu" class="menu-popup" role="menu" hidden>
            <button id="selectedOpenCode" role="menuitem" data-i18n="[text]Plugin.CreatePlugin.Action.OpenCode" data-i18n-default-value="Open in VS Code"></button>
            <button id="selectedOpenFolder" role="menuitem" data-i18n="[text]Plugin.CreatePlugin.Action.OpenFolder" data-i18n-default-value="Open folder"></button>
            <button id="selectedStartDebug" class="debug-action" role="menuitem"><span id="debugMenuIcon" class="debug-indicator">▶</span><span id="debugMenuLabel"></span></button>
            <div class="menu-separator"></div>
            <button id="selectedDelete" class="danger-action" role="menuitem" data-i18n="[text]Plugin.CreatePlugin.Action.Delete" data-i18n-default-value="Delete plugin"></button>
          </div>
        </div>
        <div class="menu-root">
          <button id="publishMenuButton" class="menu-trigger" aria-haspopup="true" aria-expanded="false" data-i18n="[text]Plugin.CreatePlugin.Toolbar.Publish" data-i18n-default-value="Publish"></button>
          <div id="publishMenu" class="menu-popup" role="menu" hidden>
            <button id="selectedPublish" role="menuitem" data-i18n="[text]Plugin.CreatePlugin.Action.Publish" data-i18n-default-value="Publish to this PC"></button>
            <button id="selectedPublishHub" role="menuitem" data-i18n="[text]Plugin.CreatePlugin.Action.PublishHub" data-i18n-default-value="Publish to Store"></button>
          </div>
        </div>
      </nav>
      <button id="clearChat" class="icon-button" data-i18n="[title]Plugin.CreatePlugin.Ai.NewChat" data-i18n-default-value="New chat" aria-label="New chat">＋</button>
    </header>
    <p id="aiUnavailable" class="warning" role="status" hidden></p>
    <section id="automaticPanel" class="chat-panel">
      <div id="aiTarget" class="ai-target" role="status"><span>◎</span><strong id="aiTargetText"></strong></div>
      <div id="chatHistory" class="chat-history" aria-live="polite"><div id="chatEmpty" class="chat-empty"><span class="spark">✦</span><b data-i18n="[text]Plugin.CreatePlugin.Ai.Empty.Title" data-i18n-default-value="What would you like to build?"></b><p data-i18n="[text]Plugin.CreatePlugin.Ai.Empty.Description" data-i18n-default-value="Describe a MyTools plugin. I can create it, explain the files, and help you refine it."></p></div></div>
      <div class="composer"><textarea id="aiPrompt" rows="4" data-i18n="[placeholder]Plugin.CreatePlugin.Ai.Placeholder" data-i18n-default-value="Describe the MyTools plugin you want to create..."></textarea><div class="composer-footer"><small data-i18n="[text]Plugin.CreatePlugin.Ai.Send.Help" data-i18n-default-value="Ctrl+Enter to send"></small><button id="sendPrompt" class="send-button" data-i18n="[title]Plugin.CreatePlugin.Ai.Send" data-i18n-default-value="Send" aria-label="Send"><svg class="send-arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 9V3.5M3.5 6 6 3.5 8.5 6"/></svg><span class="stop-square"></span></button></div></div>
    </section>
  </section>

  <div id="createModal" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <header class="modal-header"><div><span class="eyebrow" data-i18n="[text]Plugin.CreatePlugin.Wizard.Eyebrow" data-i18n-default-value="MYTOOLS PLUGIN"></span><h2 id="createModalTitle" data-i18n="[text]Plugin.CreatePlugin.Wizard.Title" data-i18n-default-value="Create a new plugin"></h2></div><button id="closeCreateModal" class="icon-button" aria-label="Close">×</button></header>
    <nav class="stepper" aria-label="Progress"><span class="active" aria-current="step"><strong>1</strong><b data-i18n="[text]Plugin.CreatePlugin.Step.Basic" data-i18n-default-value="Basics"></b></span><i></i><span><strong>2</strong><b data-i18n="[text]Plugin.CreatePlugin.Step.Generate" data-i18n-default-value="Generate"></b></span><i></i><span><strong>3</strong><b data-i18n="[text]Plugin.CreatePlugin.Step.Done" data-i18n-default-value="Ready"></b></span></nav>
    <section id="step1" class="wizard-step"><div class="form-grid"><label class="form-field"><span data-i18n="[text]Plugin.CreatePlugin.Form.Name" data-i18n-default-value="Plugin name"></span><input id="name" data-i18n="[placeholder]Plugin.CreatePlugin.Form.Name.Placeholder" data-i18n-default-value="For example: Quick Notes" autocomplete="off"></label><label class="form-field"><span data-i18n="[text]Plugin.CreatePlugin.Form.Id" data-i18n-default-value="Plugin ID"></span><input id="pluginId" data-i18n="[placeholder]Plugin.CreatePlugin.Form.Id.Placeholder" data-i18n-default-value="For example: quick-notes" autocomplete="off"><small data-i18n="[text]Plugin.CreatePlugin.Form.Id.Help" data-i18n-default-value="Lowercase letters, numbers, dots, or hyphens"></small></label></div>
      <fieldset><legend data-i18n="[text]Plugin.CreatePlugin.Form.Type" data-i18n-default-value="Plugin type"></legend><div class="choice-grid"><label class="choice selected"><input type="radio" name="type" value="standard" checked><span><b data-i18n="[text]Plugin.CreatePlugin.Form.Type.Standard" data-i18n-default-value="Results plugin"></b><small data-i18n="[text]Plugin.CreatePlugin.Form.Type.Standard.Help" data-i18n-default-value="Uses the native MyTools results list"></small></span></label><label class="choice"><input type="radio" name="type" value="custom-ui"><span><b data-i18n="[text]Plugin.CreatePlugin.Form.Type.Custom" data-i18n-default-value="Custom UI plugin"></b><small data-i18n="[text]Plugin.CreatePlugin.Form.Type.Custom.Help" data-i18n-default-value="Includes a custom HTML and TypeScript page"></small></span></label></div></fieldset>
      <p id="formError" class="error" role="alert" aria-live="polite"></p><footer><button id="cancelCreate" class="secondary" data-i18n="[text]Plugin.CreatePlugin.Action.Cancel" data-i18n-default-value="Cancel"></button><button id="create" data-i18n="[text]Plugin.CreatePlugin.Action.Create" data-i18n-default-value="Create plugin"></button></footer></section>
    <section id="step2" class="wizard-step centered" hidden><div class="spinner"></div><h2 data-i18n="[text]Plugin.CreatePlugin.Progress.Title" data-i18n-default-value="Generating your plugin"></h2><p data-i18n="[text]Plugin.CreatePlugin.Progress.Description" data-i18n-default-value="Creating the project, manifest, translations, and README files..."></p></section>
    <section id="step3" class="wizard-step centered" hidden><div class="success">✓</div><h2 data-i18n="[text]Plugin.CreatePlugin.Success.Title" data-i18n-default-value="Your plugin is ready"></h2><p data-i18n="[text]Plugin.CreatePlugin.Success.Description" data-i18n-default-value="Start in VS Code, browse the files yourself, or continue here and ask AI to shape the plugin with you."></p><dl class="plugin-details"><div><dt data-i18n="[text]Plugin.CreatePlugin.Form.Name" data-i18n-default-value="Name"></dt><dd id="detailName"></dd></div><div><dt data-i18n="[text]Plugin.CreatePlugin.Form.Id" data-i18n-default-value="Plugin ID"></dt><dd id="detailId"></dd></div><div><dt data-i18n="[text]Plugin.CreatePlugin.Form.Type" data-i18n-default-value="Type"></dt><dd id="detailType"></dd></div></dl><code id="sourcePath"></code><div class="completion-actions"><button id="openFolder" class="secondary" data-i18n="[text]Plugin.CreatePlugin.Action.OpenFolder" data-i18n-default-value="Open folder"></button><button id="openCode" class="secondary" data-i18n="[text]Plugin.CreatePlugin.Action.OpenCode" data-i18n-default-value="Open in VS Code"></button><button id="backToCreate" data-i18n="[text]Plugin.CreatePlugin.Action.ContinueAi" data-i18n-default-value="Continue with AI"></button></div></section>
  </section></div>

  <div id="publishModal" class="modal-backdrop" hidden>
    <section class="dialog-card publish-dialog" role="dialog" aria-modal="true" aria-labelledby="publishModalTitle">
      <header class="dialog-header">
        <span class="dialog-header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 20h14v-2H5v2zm7-18-5.5 5.5 1.42 1.42L11 6.84V16h2V6.84l3.08 3.08 1.42-1.42z"/></svg>
        </span>
        <div class="dialog-heading">
          <div id="publishModalTitle" class="dialog-title" data-i18n="[text]Plugin.CreatePlugin.PublishHub.Title" data-i18n-default-value="Publish plugin"></div>
          <div id="publishModalContext" class="dialog-context"></div>
        </div>
        <button id="closePublishModal" class="dialog-close" type="button" aria-label="Close">×</button>
      </header>
      <div class="dialog-body">
        <p class="dialog-lead" data-i18n="[text]Plugin.CreatePlugin.PublishHub.Description" data-i18n-default-value="Edit the plugin ID and version. Changes are saved to plugin.json and checked against the store."></p>
        <div class="dialog-field">
          <label class="dialog-label" for="publishPluginId" data-i18n="[text]Plugin.CreatePlugin.Form.Id" data-i18n-default-value="Plugin ID"></label>
          <div class="dialog-control">
            <div id="publishPluginIdWrap" class="field-input-wrap">
              <input id="publishPluginId" autocomplete="off" spellcheck="false">
              <span class="field-suffix" aria-hidden="true">
                <span id="publishPluginIdCheck" class="field-check" hidden>
                  <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M6.4 11.2 3.2 8l1.12-1.12L6.4 8.96l5.28-5.28L12.8 4.8z"/></svg>
                </span>
                <span id="publishPluginIdSpinner" class="field-spinner" hidden></span>
              </span>
            </div>
            <small id="publishPluginIdError" class="field-error" hidden></small>
          </div>
        </div>
        <div class="dialog-field">
          <label class="dialog-label" for="publishVersion" data-i18n="[text]Plugin.CreatePlugin.PublishHub.Version" data-i18n-default-value="Version"></label>
          <div class="dialog-control">
            <div id="publishVersionWrap" class="field-input-wrap">
              <input id="publishVersion" autocomplete="off" spellcheck="false">
              <span class="field-suffix" aria-hidden="true">
                <span id="publishVersionCheck" class="field-check" hidden>
                  <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M6.4 11.2 3.2 8l1.12-1.12L6.4 8.96l5.28-5.28L12.8 4.8z"/></svg>
                </span>
                <span id="publishVersionSpinner" class="field-spinner" hidden></span>
              </span>
            </div>
            <small id="publishVersionError" class="field-error" hidden></small>
          </div>
        </div>
        <div id="publishValidation" class="dialog-status" role="status"></div>
      </div>
      <footer class="dialog-toolbar">
        <button id="cancelPublish" class="secondary" type="button" data-i18n="[text]Plugin.CreatePlugin.Action.Cancel" data-i18n-default-value="Cancel"></button>
        <button id="confirmPublish" type="button" disabled data-i18n="[text]Plugin.CreatePlugin.Action.PublishHub" data-i18n-default-value="Publish to Store"></button>
      </footer>
    </section>
  </div>
  <div id="toast"></div>
</main>
<script src="./main.js"></script>
</body>
</html>
