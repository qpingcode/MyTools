<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="[text]Plugin.HelloSearch.Name" data-i18n-default-value="Hello Search"></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="badge" data-i18n="[text]Plugin.HelloSearch.Detail.Badge" data-i18n-default-value="hello plugin"></div>
        <h1 id="title" data-i18n="[text]Plugin.HelloSearch.Detail.TypeAfterHello" data-i18n-default-value="Type after hello"></h1>
        <p id="subtitle" data-i18n="[text]Plugin.HelloSearch.Detail.Subtitle" data-i18n-default-value="The host search box text is forwarded directly to this HTML page."></p>
        <div class="card">
            <div class="label" data-i18n="[text]Plugin.HelloSearch.Detail.CurrentQuery" data-i18n-default-value="Current query"></div>
            <div id="query" class="query" data-i18n="[text]Plugin.HelloSearch.Common.Empty" data-i18n-default-value="(empty)"></div>
        </div>
        <div class="card secondary-card">
            <div class="label" data-i18n="[text]Plugin.HelloSearch.Detail.RuntimeState" data-i18n-default-value="State from node runtime"></div>
            <pre id="state" class="state">{}</pre>
        </div>
        <button id="refresh" class="refresh-button" type="button"
                data-i18n="[text]Plugin.HelloSearch.Detail.Refresh"
                data-i18n-default-value="Request refresh from Node runtime"></button>
    </div>
    <script src="main.js"></script>
</body>
</html>
