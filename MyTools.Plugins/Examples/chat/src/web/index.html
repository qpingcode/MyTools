<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="[text]Plugin.Chat.Name" data-i18n-default-value="Chat"></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="chat-shell">
            <aside class="sidebar">
                <button id="newChatButton" class="new-chat-button" type="button"
                        aria-label="New chat">
                    <span class="new-chat-icon" aria-hidden="true">＋</span>
                    <span data-i18n="[text]Plugin.Chat.Detail.New" data-i18n-default-value="New chat"></span>
                </button>
                <div class="recent-label" data-i18n="[text]Plugin.Chat.Detail.Recent"
                     data-i18n-default-value="Recent"></div>
                <nav id="conversationList" class="conversation-list" aria-label="Recent conversations"></nav>
            </aside>
            <section class="panel">
                <header class="conversation-header">
                    <div id="conversationTitle" class="conversation-title"
                         data-i18n="[text]Plugin.Chat.Detail.Untitled"
                         data-i18n-default-value="New conversation"></div>
                </header>
                <div id="messages" class="messages empty"
                     data-i18n="[text]Plugin.Chat.Detail.Empty" data-i18n-default-value="Ask MyTools anything"></div>
                <div class="composer">
                    <div class="composer-row">
                        <textarea id="promptInput" spellcheck="false"
                                  data-i18n="[placeholder]Plugin.Chat.Detail.InputPlaceholder"
                                  data-i18n-default-value="Type a message"></textarea>
                        <button id="sendButton" class="send-button" type="button"
                                data-i18n="[title]Plugin.Chat.Detail.Send" data-i18n-default-value="Send"
                                aria-label="Send">
                            <svg class="send-arrow" viewBox="0 0 12 12" aria-hidden="true">
                                <path d="M6 9V3.5M3.5 6 6 3.5 8.5 6"></path>
                            </svg>
                            <span class="stop-square" aria-hidden="true"></span>
                        </button>
                    </div>
                    <div class="model-row">
                        <label for="modelSelect" data-i18n="[text]Plugin.Chat.Detail.Model" data-i18n-default-value="Model"></label>
                        <select id="modelSelect" aria-label="Model"></select>
                    </div>
                </div>
            </section>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
