<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="panel">
            <div class="label-row">
                <div class="label">DeepSeek Chat</div>
                <button id="newChatButton" class="new-chat-button" type="button">New</button>
            </div>
            <div id="messages" class="messages empty">Ask DeepSeek anything</div>
            <div class="composer">
                <textarea id="promptInput" spellcheck="false" placeholder="Type a message"></textarea>
                <button id="sendButton" class="send-button" type="button">Send</button>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
